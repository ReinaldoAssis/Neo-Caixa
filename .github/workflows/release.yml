name: Build and Release

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: write

# Uma execucao por branch por vez; um push novo cancela o build anterior para
# nao publicar releases fora de ordem (o /releases/latest ficaria errado).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

# 1.0.<run_number> e unico e crescente. O auto-update compara com a versao
# gravada em app/version.py, que o CI sobrescreve antes do PyInstaller.
env:
  VERSION: 1.0.${{ github.run_number }}

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set build version
        run: python scripts/set_version.py

      - name: Show version
        run: python -c "import app.version; print(app.version.__version__)"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build frontend
        working-directory: app/frontend
        run: |
          npm install
          npm run build

      - name: Build executable (PyInstaller)
        run: pyinstaller helena.spec --clean --noconfirm

      # ─── Package macOS (.app -> zip) ───
      - name: Package macOS artifact
        if: matrix.platform == 'macos'
        run: |
          cd dist
          if [ -d "NeoCaixa.app" ]; then
            ditto -c -k --sequesterRsrc --keepParent "NeoCaixa.app" "NeoCaixa-macos.zip"
          else
            zip -j "NeoCaixa-macos.zip" "NeoCaixa"
          fi

      - name: Upload macOS artifact
        if: matrix.platform == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: NeoCaixa-macos
          path: dist/NeoCaixa-macos.zip

      # ─── Package Windows (.exe) ───
      - name: Upload Windows artifact
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: NeoCaixa-windows
          path: dist/NeoCaixa.exe

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f

      - name: Resolve release tag
        id: tag
        run: |
          TAG="v${VERSION}"
          if [ "${GITHUB_RUN_ATTEMPT}" != "1" ]; then
            TAG="${TAG}-r${GITHUB_RUN_ATTEMPT}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF}" = "refs/heads/master" ]; then
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Neo Caixa v${{ env.VERSION }}${{ github.ref != 'refs/heads/master' && ' (pre-release)' || '' }}
          prerelease: ${{ steps.tag.outputs.prerelease }}
          generate_release_notes: true
          files: |
            artifacts/NeoCaixa-macos/NeoCaixa-macos.zip
            artifacts/NeoCaixa-windows/NeoCaixa.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
